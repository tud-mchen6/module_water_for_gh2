$schema: "https://json-schema.org/draft/2020-12/schema"
description: "Schema for user-provided configuration files."
type: object
additionalProperties: false
required:
  - municipal_benchmark
  - internal_use_factor
  - scenarios
properties:
  municipal_benchmark:
    description: "Benchmark for municipal water withdrawal per capita (m3/year)."
    type: number
    minimum: 0
  internal_use_factor:
    description: "Proportion of water usable from internal renewable sources."
    type: number
    minimum: 0
    maximum: 1
  scenarios:
    description: "Named scenarios. Each scenario can optionally include per-country overrides."
    type: object
    patternProperties:
      "^[A-Za-z0-9_-]+$":
        description: "A named scenario with all required parameters."
        $ref: "#/$defs/scenario_params_full"
    additionalProperties: false

$defs:
  scenario_params_full:
    description: "All parameters required for a full scenario definition."
    type: object
    additionalProperties: false
    required:
      - include_desal
      - include_ZLD
      - basic_withdrawal_cost
      - freshwater_for_h2
      - compensate
      - plot_limit
    if:
      properties:
        include_desal:
          const: true
    then:
      required:
        - init_salinity
        - recovery
        - desalination_cost
      properties:
        include_ZLD:
          type: boolean
    else:
      properties:
        include_ZLD:
          const: false
    properties:
      include_desal:
        description: "Whether to include desalination in water sourcing options."
        type: boolean
      include_ZLD:
        description: "Whether to include Zero Liquid Discharge (ZLD). Cannot be true if include_desal is false."
        type: boolean
      basic_withdrawal_cost:
        description: "Basic cost of water withdrawal (EUR/m3)."
        type: number
        minimum: 0
      freshwater_for_h2:
        description: "Proportion of usable water allocated for green hydrogen production."
        type: number
        minimum: 0
        maximum: 1
      compensate:
        description: "Whether to compensate water stress with desalinated water."
        type: boolean
      plot_limit:
        description: "X-axis plot limit for water curves (1e9 m3)."
        type: number
        minimum: 0
      init_salinity:
        description: "Initial seawater salinity (kg/m3)."
        type: number
        minimum: 0
      recovery:
        description: "Single-pass recovery rate of first-stage desalination (fraction of feed volume yielded as freshwater)."
        type: number
        minimum: 0
        maximum: 1
      desalination_cost:
        description: "Cost of freshwater produced at the first desalination stage (EUR/m3)."
        type: number
        minimum: 0
      overrides:
        description: "Per-country parameter overrides for this scenario. Keys are ISO 3166-1 alpha-3 country codes."
        type: object
        patternProperties:
          "^[A-Z]{3}$":
            description: "Country-level overrides. Any subset of scenario parameters is valid."
            $ref: "#/$defs/scenario_params_partial"
        additionalProperties: false

  scenario_params_partial:
    description: "Partial scenario parameters, used for per-country overrides."
    type: object
    additionalProperties: false
    properties:
      include_desal:
        description: "Whether to include desalination in water sourcing options."
        type: boolean
      include_ZLD:
        description: "Whether to include Zero Liquid Discharge (ZLD). Cannot be true if include_desal is false."
        type: boolean
      basic_withdrawal_cost:
        description: "Basic cost of water withdrawal (EUR/m3)."
        type: number
        minimum: 0
      freshwater_for_h2:
        description: "Proportion of usable water allocated for green hydrogen production."
        type: number
        minimum: 0
        maximum: 1
      compensate:
        description: "Whether to compensate water stress with desalinated water."
        type: boolean
      plot_limit:
        description: "X-axis plot limit for water curves (1e9 m3)."
        type: number
        minimum: 0
      init_salinity:
        description: "Initial seawater salinity (kg/m3)."
        type: number
        minimum: 0
      recovery:
        description: "Single-pass recovery rate of first-stage desalination (fraction of feed volume yielded as freshwater)."
        type: number
        minimum: 0
        maximum: 1
      desalination_cost:
        description: "Cost of freshwater produced at the first desalination stage (EUR/m3)."
        type: number
        minimum: 0